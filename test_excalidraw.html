<!DOCTYPE html>
<html>
<body>
<iframe id="frame" src="https://excalidraw.com/?embed=1" style="width:800px;height:600px;"></iframe>
<script>
  const frame = document.getElementById('frame');
  frame.onload = () => {
    setTimeout(() => {
      frame.contentWindow.postMessage({
        type: "update",
        elements: [{
          type: "rectangle",
          id: "rect-1",
          x: 100, y: 100, width: 100, height: 100,
          strokeColor: "#000000", backgroundColor: "transparent",
          fillStyle: "hachure", strokeWidth: 1, strokeStyle: "solid",
          roughness: 1, opacity: 100, groupIds: [], frameId: null,
          roundness: null, seed: 1, version: 1, versionNonce: 1,
          isDeleted: false, boundElements: null, updated: 1, link: null
        }]
      }, "*");
      console.log("Sent update");
    }, 2000);
  };
</script>
</body>
</html>
